<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Planet Workouts</title>

  <!-- iOS / Mobile Web App Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Workouts" />
  <meta name="theme-color" content="#121212" />

  <!-- Embedded PWA Web Manifest -->
  <link rel="manifest" href='data:application/manifest+json,{
    "name": "Planet Workouts",
    "short_name": "Workouts",
    "start_url": "./",
    "display": "standalone",
    "background_color": "#121212",
    "theme_color": "#121212",
    "icons": [
      {
        "src": "data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏋️‍♂️</text></svg>",
        "sizes": "512x512",
        "type": "image/svg+xml",
        "purpose": "any maskable"
      }
    ]
  }' />

  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --accent-color: #007aff;
      --success-color: #34c759;
      --danger-color: #ff3b30;
      --border-color: #2c2c2e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      width: 100%;
      max-width: 500px;
      padding: 16px 0 8px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 1.8rem;
      font-weight: 700;
    }

    .badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 12px;
      background: #2c2c2e;
      color: #a1a1a6;
      display: inline-block;
      margin-top: 6px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin-top: 12px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
    }

    .add-form {
      display: flex;
      gap: 8px;
    }

    input[type="text"], input[type="number"] {
      background: #2c2c2e;
      border: 1px solid #3a3a3c;
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }

    input[type="text"] {
      flex: 1;
    }

    button {
      background: var(--accent-color);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }

    button:active {
      opacity: 0.8;
    }

    .exercise-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .exercise-title h3 {
      margin: 0;
      font-size: 1.2rem;
    }

    .btn-delete {
      background: transparent;
      color: var(--danger-color);
      padding: 4px 8px;
      font-size: 0.85rem;
    }

    .set-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .set-label {
      width: 45px;
      font-size: 0.85rem;
      color: #8e8e93;
    }

    .set-input {
      width: 70px;
      text-align: center;
    }

    .checkbox-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: #2c2c2e;
      border: 1px solid #3a3a3c;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin-left: auto;
      font-size: 1.1rem;
    }

    .checkbox-btn.completed {
      background: var(--success-color);
      border-color: var(--success-color);
    }

    .btn-add-set {
      background: #2c2c2e;
      color: var(--accent-color);
      width: 100%;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Planet Workouts</h1>
    <div id="status" class="badge">Offline Ready</div>
  </header>

  <div class="container">
    <!-- Add Exercise Form -->
    <div class="card">
      <form id="add-exercise-form" class="add-form">
        <input type="text" id="exercise-name" placeholder="New Exercise (e.g. Incline Press)" required />
        <button type="submit">Add</button>
      </form>
    </div>

    <!-- Exercises Container -->
    <div id="exercises-list"></div>
  </div>

  <script>
    // ----------------------------------------------------
    // 1. LocalStorage State Management
    // ----------------------------------------------------
    const STORAGE_KEY = 'planet_workouts_data';

    let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [
      {
        id: '1',
        name: 'Incline Dumbbell Press',
        sets: [
          { weight: '50', reps: '10', completed: true },
          { weight: '55', reps: '8', completed: false }
        ]
      }
    ];

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      render();
    }

    function render() {
      const container = document.getElementById('exercises-list');
      container.innerHTML = '';

      state.forEach((ex, exIndex) => {
        const card = document.createElement('div');
        card.className = 'card';

        let setsHTML = ex.sets.map((set, setIndex) => `
          <div class="set-row">
            <span class="set-label">Set ${setIndex + 1}</span>
            <input type="number" class="set-input" placeholder="lbs" value="${set.weight}" 
                   onchange="updateSet(${exIndex}, ${setIndex}, 'weight', this.value)" />
            <input type="number" class="set-input" placeholder="reps" value="${set.reps}" 
                   onchange="updateSet(${exIndex}, ${setIndex}, 'reps', this.value)" />
            <div class="checkbox-btn ${set.completed ? 'completed' : ''}" 
                 onclick="toggleSet(${exIndex}, ${setIndex})">
              ${set.completed ? '✓' : ''}
            </div>
          </div>
        `).join('');

        card.innerHTML = `
          <div class="exercise-title">
            <h3>${ex.name}</h3>
            <button class="btn-delete" onclick="deleteExercise(${exIndex})">Remove</button>
          </div>
          ${setsHTML}
          <button class="btn-add-set" onclick="addSet(${exIndex})">+ Add Set</button>
        `;

        container.appendChild(card);
      });
    }

    function addExercise(name) {
      state.push({
        id: Date.now().toString(),
        name: name,
        sets: [{ weight: '', reps: '', completed: false }]
      });
      saveState();
    }

    function deleteExercise(index) {
      state.splice(index, 1);
      saveState();
    }

    function addSet(exIndex) {
      const lastSet = state[exIndex].sets[state[exIndex].sets.length - 1] || { weight: '', reps: '' };
      state[exIndex].sets.push({ weight: lastSet.weight, reps: lastSet.reps, completed: false });
      saveState();
    }

    function updateSet(exIndex, setIndex, field, value) {
      state[exIndex].sets[setIndex][field] = value;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function toggleSet(exIndex, setIndex) {
      state[exIndex].sets[setIndex].completed = !state[exIndex].sets[setIndex].completed;
      saveState();
    }

    document.getElementById('add-exercise-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('exercise-name');
      if (input.value.trim()) {
        addExercise(input.value.trim());
        input.value = '';
      }
    });

    render();

    // ----------------------------------------------------
    // 2. Service Worker for PWA Offline Functionality
    // ----------------------------------------------------
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'planet-workouts-v1';
        
        self.addEventListener('install', (event) => {
          self.skipWaiting();
        });

        self.addEventListener('activate', (event) => {
          event.waitUntil(clients.claim());
        });

        self.addEventListener('fetch', (event) => {
          event.respondWith(
            caches.match(event.request).then((cachedResponse) => {
              if (cachedResponse) {
                return cachedResponse;
              }
              return fetch(event.request).then((response) => {
                if (!response || response.status !== 200 || response.type !== 'basic') {
                  return response;
                }
                const responseToCache = response.clone();
                caches.open(CACHE_NAME).then((cache) => {
                  cache.put(event.request, responseToCache);
                });
                return response;
              }).catch(() => {
                return caches.match('./');
              });
            })
          );
        });
      `;

      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);

      navigator.serviceWorker.register(swUrl)
        .then(() => {
          document.getElementById('status').innerText = 'PWA Active (Offline Ready)';
        })
        .catch(() => {
          document.getElementById('status').innerText = 'Local Storage Active';
        });
    }
  </script>
</body>
</html>
